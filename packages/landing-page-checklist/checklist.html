<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>落地页上线前检查清单 · 37 项</title>
<meta name="description" content="落地页上线前 37 项检查清单，分 7 组，可勾选、带进度条、本地保存、可打印。">
<style>
  :root {
    --bg: #f6f7f9;
    --card: #fff;
    --ink: #111827;
    --ink-2: #4b5563;
    --ink-3: #6b7280;
    --line: #e5e7eb;
    --accent: #0f766e;
    --accent-soft: #ecfdf5;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(17, 24, 39, .04), 0 8px 24px rgba(17, 24, 39, .06);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 24px 16px 64px;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  .wrap { max-width: 800px; margin: 0 auto; }

  /* ---------- 头部 ---------- */
  .hero { margin-bottom: 18px; }
  .hero h1 {
    margin: 0 0 6px;
    font-size: clamp(21px, 5vw, 27px);
    line-height: 1.3;
    letter-spacing: -.01em;
  }
  .hero p { margin: 0; color: var(--ink-2); font-size: 14px; }

  /* ---------- 进度条 ---------- */
  .progress-card {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px 18px;
    margin-bottom: 18px;
  }
  .progress-top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .progress-top strong { font-size: 15px; color: var(--accent); }
  .progress-top span { color: var(--ink-3); }

  .track {
    height: 8px;
    border-radius: 999px;
    background: #eef0f3;
    overflow: hidden;
  }
  .fill {
    height: 100%;
    width: 0;
    border-radius: 999px;
    background: var(--accent);
    transition: width .25s ease;
  }

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }
  .btn {
    padding: 6px 13px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #fff;
    color: var(--ink-2);
    font: inherit;
    font-size: 13px;
    cursor: pointer;
    transition: all .15s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---------- 分组 ---------- */
  .group {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px 20px;
    margin-bottom: 14px;
  }
  .group h2 {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin: 0 0 4px;
    font-size: 16px;
  }
  .group h2 em {
    font-style: normal;
    font-size: 12px;
    font-weight: 400;
    color: var(--ink-3);
  }
  .group .count {
    margin-left: auto;
    font-size: 12px;
    font-weight: 400;
    color: var(--ink-3);
  }

  /* ---------- 条目 ---------- */
  .item {
    display: grid;
    grid-template-columns: 22px 1fr;
    gap: 10px;
    padding: 12px 0;
    border-top: 1px solid var(--line);
    cursor: pointer;
  }
  .item:first-of-type { border-top: 0; }

  .item input {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    border: 0;
  }

  .box {
    width: 20px;
    height: 20px;
    margin-top: 2px;
    border: 1.5px solid #c9ced6;
    border-radius: 6px;
    background: #fff;
    transition: all .15s;
    position: relative;
  }
  .box::after {
    content: "";
    position: absolute;
    left: 6px;
    top: 2px;
    width: 5px;
    height: 10px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg) scale(0);
    transition: transform .15s;
  }
  .item input:focus-visible + .box {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .item input:checked + .box {
    background: var(--accent);
    border-color: var(--accent);
  }
  .item input:checked + .box::after { transform: rotate(45deg) scale(1); }

  .body { min-width: 0; }
  .title { font-weight: 600; font-size: 14px; }
  .title em {
    font-style: normal;
    font-weight: 400;
    font-size: 12px;
    color: var(--ink-3);
    margin-left: 6px;
  }
  .pass, .fix {
    margin: 4px 0 0;
    font-size: 13px;
    color: var(--ink-2);
  }
  .fix { color: var(--ink-3); }

  .item input:checked ~ .body .title { color: var(--ink-3); text-decoration: line-through; }
  .item input:checked ~ .body .pass,
  .item input:checked ~ .body .fix { opacity: .55; }

  /* ---------- 页脚 ---------- */
  footer {
    margin-top: 26px;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    line-height: 1.8;
    color: var(--ink-3);
  }
  footer p { margin: 0; }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:hover { text-decoration: underline; }

  /* ---------- 打印 ---------- */
  @media print {
    @page { margin: 14mm; }
    body { background: #fff; padding: 0; font-size: 11pt; }
    .hero { margin-bottom: 10px; }
    .progress-card {
      position: static;
      box-shadow: none;
      border: 1px solid var(--line);
      margin-bottom: 10px;
    }
    .toolbar { display: none !important; }
    .group { box-shadow: none; break-inside: avoid; padding: 10px 14px; }
    .item { break-inside: avoid; padding: 7px 0; }
    .item input:checked ~ .body .title { text-decoration: line-through; }
    footer { margin-top: 12px; }
    a { color: inherit; text-decoration: none; }
  }
</style>
</head>
<body>
<main class="wrap">

  <header class="hero">
    <h1>落地页上线前检查清单</h1>
    <p>37 项 · 7 组。勾选状态自动保存在本机浏览器，关掉再打开还在；点「打印」可直接出 PDF。</p>
  </header>

  <section class="progress-card">
    <div class="progress-top">
      <strong id="progressText">0 / 37</strong>
      <span id="progressPct">0%</span>
    </div>
    <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="37"
         aria-valuenow="0" id="progressBar">
      <div class="fill" id="fill"></div>
    </div>
    <div class="toolbar">
      <button class="btn" id="printBtn" type="button">打印 / 存 PDF</button>
      <button class="btn" id="resetBtn" type="button">全部清空</button>
    </div>
  </section>

  <div id="groups"></div>

  <footer>
    <p>清单为通用技术核对项，不构成对投放结果、平台审核或账号状态的任何说明或承诺。</p>

  </footer>

</main>

  ];

  var TOTAL = 0;
  GROUPS.forEach(function (group) { TOTAL += group.items.length; });

  var els = {
    groups: document.getElementById('groups'),
    fill: document.getElementById('fill'),
    progressBar: document.getElementById('progressBar'),
    progressText: document.getElementById('progressText'),
    progressPct: document.getElementById('progressPct'),
    printBtn: document.getElementById('printBtn'),
    resetBtn: document.getElementById('resetBtn')
  };

  var done = load();

  function load() {
    try {
      var data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      return data && typeof data === 'object' ? data : {};
    } catch (e) {
      return {};
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(done));
    } catch (e) {
      /* 隐私模式下写入失败时静默忽略 */
    }
  }

  function updateProgress() {
    var count = 0;
    GROUPS.forEach(function (group) {
      group.items.forEach(function (item) {
        if (done[item.id]) count += 1;
      });
    });

    var pct = TOTAL ? Math.round((count / TOTAL) * 100) : 0;
    els.fill.style.width = pct + '%';
    els.progressText.textContent = count + ' / ' + TOTAL;
    els.progressPct.textContent = pct + '%';
    els.progressBar.setAttribute('aria-valuenow', String(count));
  }

  function makeItem(item) {
    var label = document.createElement('label');
    label.className = 'item';

    var input = document.createElement('input');
    input.type = 'checkbox';
    input.checked = Boolean(done[item.id]);
    input.addEventListener('change', function () {
      if (input.checked) {
        done[item.id] = true;
      } else {
        delete done[item.id];
      }
      save();
      updateProgress();
    });

    var box = document.createElement('span');
    box.className = 'box';
    box.setAttribute('aria-hidden', 'true');

    var body = document.createElement('div');
    body.className = 'body';

    var title = document.createElement('div');
    title.className = 'title';
    title.textContent = item.title;

    var en = document.createElement('em');
    en.textContent = item.en;
    title.appendChild(en);

    var pass = document.createElement('p');
    pass.className = 'pass';
    pass.textContent = '判断标准：' + item.pass;

    body.appendChild(title);
    body.appendChild(pass);

    if (item.fix) {
      var fix = document.createElement('p');
      fix.className = 'fix';
      fix.textContent = '不合格怎么改：' + item.fix;
      body.appendChild(fix);
    }

    label.appendChild(input);
    label.appendChild(box);
    label.appendChild(body);
    return label;
  }

  function render() {
    GROUPS.forEach(function (group) {
      var section = document.createElement('section');
      section.className = 'group';

      var heading = document.createElement('h2');
      heading.textContent = group.title;

      var en = document.createElement('em');
      en.textContent = group.en;
      heading.appendChild(en);

      var count = document.createElement('span');
      count.className = 'count';
      count.textContent = group.items.length + ' 项';
      heading.appendChild(count);

      section.appendChild(heading);
      group.items.forEach(function (item) {
        section.appendChild(makeItem(item));
      });
      els.groups.appendChild(section);
    });
  }

  els.printBtn.addEventListener('click', function () {
    window.print();
  });

  els.resetBtn.addEventListener('click', function () {
    if (!window.confirm('确定清空全部勾选记录？')) return;
    done = {};
    save();
    Array.prototype.forEach.call(
      document.querySelectorAll('.item input'),
      function (input) { input.checked = false; }
    );
    updateProgress();
  });

  render();
  updateProgress();
})();
</script>
</body>
</html>
