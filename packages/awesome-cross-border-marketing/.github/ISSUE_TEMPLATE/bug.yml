name: Link / data issue
description: 链接失效、条目信息错误、分类不对
title: "[data] "
labels: ["bug"]
body:
  - type: input
    id: tool
    attributes:
      label: 哪个条目
      placeholder: "工具名或 data/tools.json 里的 id"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题
      description: 403/404、跳转异常、描述不准确等
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: 相关链接
    validations:
      required: false
