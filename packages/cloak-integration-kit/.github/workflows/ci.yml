name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Node.js Test & Contract Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run unit & E2E mock integration tests
        run: node --test test/integration.test.mjs

      - name: Run CLI contract simulation check
        run: node cli.mjs simulate --ua "BotDemo/1.0" --ip "198.51.100.42" --json
