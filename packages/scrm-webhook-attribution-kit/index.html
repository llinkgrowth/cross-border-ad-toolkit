<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SCRM Webhook Attribution &amp; Safe Broadcast State Machine Demo</title>
  <style>
    :root {
      --bg: #090d16;
      --panel: #111827;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --ok: #22c55e;
      --warn: #f59e0b;
      --err: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      background: #060911;
    }
    header h1 { margin: 0; font-size: 18px; font-weight: 700; }
    header .badge {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.14);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.35);
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      padding: 20px 24px;
      max-width: 1480px;
      margin: 0 auto;
    }
    @media (max-width: 1020px) {
      .grid { grid-template-columns: 1fr; }
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
    }
    .card h2 {
      margin: 0 0 12px;
      font-size: 15px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .field { margin-bottom: 12px; }
    .field label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .field input, .field select, .field textarea {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0b1120;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
    }
    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 12px 0;
    }
    button {
      padding: 9px 14px;
      border-radius: 7px;
      border: none;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-primary { background: var(--accent); color: #082f49; }
    .btn-warn { background: var(--warn); color: #451a03; }
    .btn-ok { background: var(--ok); color: #052e16; }
    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    pre {
      margin: 8px 0 0;
      padding: 12px;
      background: #070b12;
      border: 1px solid #1e293b;
      border-radius: 8px;
      overflow-x: auto;
      font-size: 12px;
      color: #e2e8f0;
    }
    .queue-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border-radius: 6px;
      background: #0b1120;
      border: 1px solid #1e293b;
      margin-bottom: 8px;
      font-size: 12px;
      gap: 8px;
      flex-wrap: wrap;
    }
    .tag {
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 700;
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .tag-SENT { background: rgba(34, 197, 94, 0.18); color: #4ade80; }
    .tag-QUEUED { background: rgba(148, 163, 184, 0.16); color: #cbd5e1; }
    .tag-PENDING_MANUAL_REVIEW { background: rgba(245, 158, 11, 0.22); color: #fbbf24; border: 1px solid #f59e0b; }
    .banner-review {
      padding: 12px;
      border-radius: 8px;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.45);
      color: #fde68a;
      font-size: 12px;
      margin-bottom: 12px;
      display: none;
    }
  </style>
</head>
<body>
  <header>
    <h1>SCRM Webhook Attribution &amp; Safe Broadcast State Machine Sandbox</h1>
    <span class="badge">Offline Demo • RefCode Parser + HMAC Webhook + Unknown-State Lock</span>
  </header>

  <main class="grid">
    <!-- Left Card: Inbound First-Message RefCode & Webhook HMAC -->
    <section class="card">
      <h2>1. 真实开口首句 RefCode 归因 &amp; Webhook 签名验签</h2>
      <div class="field">
        <label for="in-msg">模拟客户在 WhatsApp / Telegram 发来的第一条入站消息</label>
        <input id="in-msg" type="text" value="Hello, can you send me the wholesale price list? [ref:LP08_FB_9F2A]" />
      </div>
      <div class="row-2">
        <div class="field">
          <label for="in-visitor">Visitor / Contact ID</label>
          <input id="in-visitor" type="text" value="wa_85291234567" />
        </div>
        <div class="field">
          <label for="in-secret">Webhook HMAC Secret</label>
          <input id="in-secret" type="text" value="whsec_live_98a7b6c5d4e3" />
        </div>
      </div>

      <div class="btn-row">
        <button id="btn-parse" type="button" class="btn-primary">解析首句 RefCode 并生成签名 Webhook 包</button>
        <button id="btn-replay-test" type="button" class="btn-ghost">模拟重复投递 (测试幂等去重拦截)</button>
      </div>

      <pre id="webhook-out"></pre>
    </section>

    <!-- Right Card: Safe Broadcast Throttler & Unknown State Lock -->
    <section class="card">
      <h2>2. 有人值守节流队列 &amp; 「状态未知 (unknown) 严禁自动重发」状态机</h2>
      <div class="row-2">
        <div class="field">
          <label for="sel-tier">节流随机抖动档位 (Throttle Tier)</label>
          <select id="sel-tier">
            <option value="fast">Fast (3000ms - 6000ms)</option>
            <option value="medium" selected>Medium (8000ms - 15000ms)</option>
            <option value="slow">Slow (20000ms - 30000ms)</option>
          </select>
        </div>
        <div class="field">
          <label for="in-unknown-idx">在第几条模拟网络超时 (`status = "unknown"`)</label>
          <input id="in-unknown-idx" type="number" min="1" max="6" value="3" />
        </div>
      </div>

      <div class="btn-row">
        <button id="btn-run-queue" type="button" class="btn-primary">启动队列模拟 (Run Queue)</button>
        <button id="btn-confirm-sent" type="button" class="btn-ok" style="display:none;">人工核对：实际已发出 (标记 SENT 并继续)</button>
        <button id="btn-manual-resend" type="button" class="btn-warn" style="display:none;">人工核对：确认未发出 (人工放行补发)</button>
      </div>

      <div id="review-banner" class="banner-review"></div>
      <div id="queue-list"></div>
    </section>
  </main>

  <script>
    (function () {
      const seenKeys = new Set();

      function parseInboundRefCode(text) {
        const raw = String(text || '');
        const match = raw.match(/(?:\[ref:([a-zA-Z0-9_-]{3,64})\]|\(ref:([a-zA-Z0-9_-]{3,64})\))/i);
        if (!match) {
          return {
            matched: false,
            refCode: null,
            cleanText: raw.trim(),
            pageId: null,
            channel: null,
            clickHash: null,
            attributionStage: 'UNATTRIBUTED_ORGANIC'
          };
        }
        const code = match[1] || match[2];
        const parts = code.split('_');
        return {
          matched: true,
          refCode: code,
          cleanText: raw.replace(match[0], '').replace(/\s{2,}/g, ' ').trim(),
          pageId: (parts[0] || '').toUpperCase(),
          channel: (parts[1] || '').toUpperCase(),
          clickHash: (parts.slice(2).join('_') || '').toUpperCase(),
          attributionStage: 'REAL_INBOUND_OPEN'
        };
      }

      // Deterministic lightweight FNV-based hex digest for offline browser preview
      function pseudoHmacHex(secret, message) {
        const input = secret + '::' + message;
        let h1 = 0xcbf29ce484222325n;
        let h2 = 0x84222325cbf29ce4n;
        const prime = 0x100000001b3n;
        const mask = 0xffffffffffffffffn;
        for (let i = 0; i < input.length; i++) {
          const c = BigInt(input.charCodeAt(i));
          h1 = ((h1 ^ c) * prime) & mask;
          h2 = ((h2 ^ (c + BigInt(i))) * prime) & mask;
        }
        return (
          h1.toString(16).padStart(16, '0') +
          h2.toString(16).padStart(16, '0') +
          (h1 ^ h2).toString(16).padStart(16, '0') +
          ((h1 + h2) & mask).toString(16).padStart(16, '0')
        );
      }

      function renderWebhookDemo(isReplay) {
        const text = document.getElementById('in-msg').value;
        const visitor = document.getElementById('in-visitor').value.trim();
        const secret = document.getElementById('in-secret').value.trim();
        const parsed = parseInboundRefCode(text);
        const ts = Math.floor(Date.now() / 1000);

        const dedupKey = 'vis:' + visitor + ':ref:' + (parsed.refCode || 'none');
        if (!isReplay) seenKeys.clear();
        const isDuplicate = seenKeys.has(dedupKey);
        seenKeys.add(dedupKey);

        const payload = {
          event: 'inbound_first_message_open',
          visitor_id: visitor,
          attribution: parsed,
          timestamp: ts
        };
        const rawBody = JSON.stringify(payload);
        const sig = pseudoHmacHex(secret, ts + '.' + rawBody);

        const result = {
          parsedAttribution: parsed,
          webhookHeaders: {
            'Content-Type': 'application/json',
            'X-SCRM-Signature': 't=' + ts + ',v1=' + sig
          },
          verificationResult: isDuplicate
            ? { valid: false, reason: 'DUPLICATE_EVENT_IDEMPOTENT_BLOCK', dedupKey }
            : { valid: true, reason: null, replayWindowSec: 300, dedupKey }
        };

        document.getElementById('webhook-out').textContent = JSON.stringify(result, null, 2);
      }

      document.getElementById('btn-parse').addEventListener('click', () => renderWebhookDemo(false));
      document.getElementById('btn-replay-test').addEventListener('click', () => renderWebhookDemo(true));

      // Safe Broadcast State Machine simulation
      const TIERS = {
        fast: [3000, 6000],
        medium: [8000, 15000],
        slow: [20000, 30000]
      };
      let queueItems = [];
      let lockedIndex = null;

      function initQueue() {
        const tier = document.getElementById('sel-tier').value;
        const [min, max] = TIERS[tier] || TIERS.medium;
        const unknownAt = Number(document.getElementById('in-unknown-idx').value) || 3;
        lockedIndex = unknownAt;

        queueItems = Array.from({ length: 6 }, (_, i) => {
          const idx = i + 1;
          const jitter = Math.floor(min + ((idx * 37) % 100) / 100 * (max - min));
          return {
            index: idx,
            uid: 'wa_contact_00' + idx,
            name: 'Client #' + idx,
            delayMs: jitter,
            state: 'QUEUED',
            note: 'Waiting in queue'
          };
        });

        stepQueue(unknownAt);
      }

      function stepQueue(trapIndex) {
        let paused = false;
        for (const item of queueItems) {
          if (item.state !== 'QUEUED') continue;
          if (trapIndex && item.index === trapIndex) {
            item.state = 'PENDING_MANUAL_REVIEW';
            item.note = 'status="unknown" -> Locked! Auto-retry is strictly blocked.';
            paused = true;
            break;
          }
          item.state = 'SENT';
          item.note = 'Delivered ACK verified';
        }
        renderQueueUI(paused);
      }

      function renderQueueUI(paused) {
        const banner = document.getElementById('review-banner');
        const btnConfirm = document.getElementById('btn-confirm-sent');
        const btnResend = document.getElementById('btn-manual-resend');

        if (paused) {
          banner.style.display = 'block';
          banner.innerHTML =
            '<strong>⏸ 队列已触发保护暂停 (PAUSED_ON_UNKNOWN)：</strong> 第 #' +
            lockedIndex +
            ' 条消息返回 <code>status = "unknown"</code>。系统已强制锁定为 <code>PENDING_MANUAL_REVIEW</code>，<strong>绝不自动重发</strong>，请人工核对聊天窗口后选择操作。';
          btnConfirm.style.display = 'inline-block';
          btnResend.style.display = 'inline-block';
        } else {
          banner.style.display = 'none';
          btnConfirm.style.display = 'none';
          btnResend.style.display = 'none';
        }

        const listEl = document.getElementById('queue-list');
        listEl.innerHTML = queueItems
          .map(
            (item) => `
          <div class="queue-item">
            <span><strong>#${item.index}</strong> <code>${item.uid}</code> (${item.name}) • Jitter: ${item.delayMs}ms</span>
            <span>
              <span style="color:#94a3b8;margin-right:8px;">${item.note}</span>
              <span class="tag tag-${item.state}">${item.state}</span>
            </span>
          </div>
        `
          )
          .join('');
      }

      document.getElementById('btn-run-queue').addEventListener('click', initQueue);
      document.getElementById('btn-confirm-sent').addEventListener('click', () => {
        const target = queueItems.find((i) => i.state === 'PENDING_MANUAL_REVIEW');
        if (target) {
          target.state = 'SENT';
          target.note = 'Operator confirmed already sent (0 duplicate sends)';
        }
        stepQueue(null);
      });
      document.getElementById('btn-manual-resend').addEventListener('click', () => {
        const target = queueItems.find((i) => i.state === 'PENDING_MANUAL_REVIEW');
        if (target) {
          target.state = 'QUEUED';
          target.note = 'Operator approved manual resend';
        }
        stepQueue(null);
      });

      renderWebhookDemo(false);
      initQueue();
    })();
  </script>
</body>
</html>
