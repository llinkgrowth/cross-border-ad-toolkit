name: Bug report / 问题反馈
description: 生成结果不对、页面报错、复制失败等问题
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量提供可复现的输入（脱敏后的链接即可），不要贴真实客户链接或密钥。
  - type: input
    id: input
    attributes:
      label: 输入
      description: 落地页 URL + 填了哪些 utm 参数（脱敏）
      placeholder: "example.com/landing --source facebook --medium cpc"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 生成了什么、哪里不对
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: 在哪里复现
      options:
        - 网页版（index.html）
        - CLI（node cli.mjs）
        - 构建（npm run build）
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境
      description: 浏览器 / Node 版本 / 操作系统
      placeholder: "Chrome 126 / Node 22 / macOS"
