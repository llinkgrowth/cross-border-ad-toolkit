name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node 20 · test + build + check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Unit tests
        run: npm test

      - name: Verify committed index.html is up to date
        run: npm run check

      - name: Rebuild
        run: npm run build

      - name: Check again after rebuild (determinism)
        run: npm run check
